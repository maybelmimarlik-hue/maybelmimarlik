<style>
  :root{
    --gold-deep:#8a6a3f;
    --gold:#c9a06a;
    --gold-bright:#f3dfae;
    --ink:#070a08;
    --ink2:#0d130f;
    --bar-h:78px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    padding:18px;
    position:relative;
  }

  /* warm ambient studio light behind the card, corners only — no scene-wide glow */
  .ambient{
    position:fixed; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 12% 100%, rgba(169,120,77,.16), transparent 60%),
      radial-gradient(ellipse 60% 40% at 88% 100%, rgba(169,120,77,.14), transparent 60%),
      radial-gradient(ellipse 70% 55% at 50% 8%, rgba(120,90,55,.10), transparent 65%);
  }

  .scene{
    position:relative;
    perspective:1600px;
    touch-action:none;
  }

  .tilt{
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.22,.61,.36,1);
    animation:cardIn 1s cubic-bezier(.16,.84,.32,1) both;
  }

  .card-shell{
    position:relative;
  }

  /* çerçeve tamamen sabit — sadece yumuşak, sabit bir altın parıltı arkada nefes alır */
  .card-glow{
    position:absolute;
    inset:-22px;
    border-radius:56px;
    background:radial-gradient(ellipse at 50% 50%, rgba(233,184,122,.38), rgba(169,120,77,.12) 55%, transparent 76%);
    filter:blur(20px);
    animation:twinkle 4.6s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  .card-frame{
    position:relative;
    z-index:1;
    width:min(90vw, 620px, 56vh);
    border-radius:34px;
    padding:11px;
    background:linear-gradient(155deg,#6e5330 0%, #e8cd93 30%, #a9784d 52%, #f6e6bd 72%, #6e5330 100%);
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,.85),
      0 8px 26px -8px rgba(0,0,0,.6),
      inset 0 0 0 1px rgba(255,255,255,.18);
  }

  /* çerçeve dönmüyor — sadece küçük, ışıltılı ışık noktaları onun kenarı boyunca gezinir */
  .light-track{
    position:absolute; inset:0;
    offset-path:inset(0px round 34px);
    offset-anchor:0% 0%;
    offset-rotate:0deg;
    offset-distance:0%;
    animation-name:travel;
    animation-duration:12s;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    pointer-events:none;
    z-index:2;
  }
  .light-track::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:12px; height:12px;
    margin:-6px 0 0 -6px;
    border-radius:50%;
    background:radial-gradient(circle, var(--dot-c1) 0%, var(--dot-c2) 45%, transparent 78%);
    box-shadow:0 0 10px 3px var(--dot-glow), 0 0 22px 9px rgba(201,160,106,.35);
  }
  .light-track.t1{ --dot-c1:#fff8e8; --dot-c2:#ffdb9e; --dot-glow:rgba(255,224,158,.85); animation-delay:0s; }
  .light-track.t2{ --dot-c1:#fff1e0; --dot-c2:#e7b56e; --dot-glow:rgba(231,181,110,.8);  animation-delay:-4s; }
  .light-track.t3{ --dot-c1:#ffe8e0; --dot-c2:#d99b6a; --dot-glow:rgba(217,155,106,.8);  animation-delay:-8s; }

  .card-inner{
    position:relative;
    border-radius:24px;
    overflow:hidden;
    background:var(--ink);
    display:flex;
    flex-direction:column;
  }

  .poster-wrap{
    position:relative;
    overflow:hidden;
    line-height:0;
  }
  .poster{
    display:block;
    width:100%;
    height:auto;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
    transition:transform .35s cubic-bezier(.22,.61,.36,1);
  }

  /* --- gerçek görselden ayrıştırılan, bağımsız animasyonlu yaprak dalı --- */
  .leaf-overlay{
    position:absolute;
    top:0; left:0;
    width:49.2%;
    height:auto;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
    transform-origin:2% 4%;
    animation:leafSway 7s ease-in-out infinite;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.03));
  }

  /* --- görselden çıkarılan, gerçek/3D-hover'lı hizmet başlıkları --- */
  .svc-titles{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .svc-title{
    position:absolute;
    top:74.3%;
    height:4.3%;
    width:20%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:auto;
    cursor:default;
    perspective:240px;
  }
  .svc-title span{
    display:inline-block;
    font-weight:600;
    text-transform:uppercase;
    color:#1c1a17;
    line-height:1.24;
    font-size:calc(var(--pw, 941px) * 0.0163);
    letter-spacing:calc(var(--pw, 941px) * 0.0012);
    transition:transform .32s cubic-bezier(.22,.61,.36,1), color .32s ease, text-shadow .32s ease;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .svc-title:hover span, .svc-title:focus-visible span{
    transform:rotateX(-16deg) translateY(-3px) scale(1.07);
    color:var(--gold-deep);
    text-shadow:0 10px 16px rgba(169,120,77,.35);
  }
  .svc-title:nth-child(1){ left:0%;  }
  .svc-title:nth-child(2){ left:20%; }
  .svc-title:nth-child(3){ left:40%; }
  .svc-title:nth-child(4){ left:60%; }
  .svc-title:nth-child(5){ left:80%; }

  /* very light diagonal glare sweeping across the poster, occasionally */
  .sheen{
    position:absolute; inset:0;
    background:linear-gradient(72deg,
      transparent 42%,
      rgba(255,255,255,.10) 47%,
      rgba(255,246,222,.22) 50%,
      rgba(255,255,255,.10) 53%,
      transparent 58%);
    transform:translateX(-140%);
    animation:sheenSweep 7.5s ease-in-out infinite;
    mix-blend-mode:overlay;
    pointer-events:none;
  }

  .badge{
    position:absolute;
    top:4.6%; right:4.4%;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 12px;
    border-radius:999px;
    background:rgba(10,10,10,.72);
    border:1px solid rgba(201,160,106,.55);
    backdrop-filter:blur(3px);
    box-shadow:0 8px 20px -8px rgba(0,0,0,.6);
    animation:fadeIn .8s ease .5s both, badgePulse 3.2s ease-in-out 1.4s infinite;
  }
  .badge svg{ width:15px; height:15px; color:var(--gold-bright); flex:none; }
  .badge-text{ display:flex; flex-direction:column; line-height:1.15; }
  .badge-text b{ font-size:9.5px; letter-spacing:.05em; color:#fff; font-weight:600; }
  .badge-text span{ font-size:7.8px; letter-spacing:.05em; color:rgba(255,255,255,.62); }

  .iconbar{
    height:var(--bar-h);
    flex:none;
    background:linear-gradient(180deg,#101710,#05070573);
    background-color:var(--ink2);
    display:flex;
    align-items:center;
    justify-content:space-evenly;
    padding:0 6px;
    touch-action:manipulation;
    border-top:1px solid rgba(201,160,106,.22);
  }
  .icon-btn{
    position:relative;
    -webkit-appearance:none;
    appearance:none;
    border:none;
    background:transparent;
    width:15.5%;
    max-width:52px;
    aspect-ratio:1/1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    border:1.4px solid rgba(201,160,106,.55);
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    touch-action:manipulation;
  }
  .icon-btn svg{ width:44%; height:44%; position:relative; z-index:2; }
  /* ikonun tam üzerine düşen ışık hüzmesi (spot) */
  .icon-btn::before{
    content:"";
    position:absolute;
    left:50%; top:50%;
    width:220%; height:220%;
    transform:translate(-50%,-50%) scale(.4);
    background:radial-gradient(circle, rgba(255,241,204,.9) 0%, rgba(255,224,158,.35) 38%, transparent 72%);
    opacity:0;
    transition:opacity .32s ease, transform .45s cubic-bezier(.2,.8,.3,1.2);
    pointer-events:none;
    z-index:0;
  }
  /* ikondan yukarı doğru yükselen ince ışık şerabı */
  .icon-btn::after{
    content:"";
    position:absolute;
    left:50%; bottom:96%;
    width:2px; height:0;
    background:linear-gradient(to top, rgba(255,238,196,.95), rgba(255,238,196,0) 85%);
    transform:translateX(-50%);
    filter:blur(2.5px);
    opacity:0;
    transition:height .4s cubic-bezier(.2,.8,.3,1), opacity .3s ease;
    pointer-events:none;
    z-index:3;
  }
  .icon-btn:hover, .icon-btn:focus-visible{
    color:var(--ink);
    background:linear-gradient(155deg,var(--gold-bright),var(--gold));
    box-shadow:0 0 0 1px rgba(201,160,106,.7), 0 6px 16px -4px rgba(201,160,106,.6);
    outline:none;
  }
  .icon-btn:hover::before, .icon-btn:focus-visible::before{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  .icon-btn:hover::after, .icon-btn:focus-visible::after{
    height:42px;
    opacity:1;
  }
  .icon-btn:active{ transform:scale(.9); }

  .wordmark{
    text-align:center;
    font-size:9px;
    letter-spacing:.42em;
    color:rgba(201,160,106,.8);
    font-weight:600;
    padding:0 0 12px;
    background:var(--ink2);
  }

  .toast{
    position:fixed;
    left:50%; bottom:22px;
    transform:translate(-50%, 14px);
    background:rgba(15,14,12,.92);
    color:#f3e9d4;
    border:1px solid rgba(201,160,106,.5);
    padding:9px 18px;
    border-radius:999px;
    font-size:12.5px;
    letter-spacing:.02em;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  @keyframes cardIn{
    from{ opacity:0; transform:rotateX(50deg) translateY(-40px) scale(.94); }
    to{ opacity:1; transform:rotateX(0) translateY(0) scale(1); }
  }
  @keyframes travel{ to{ offset-distance:100%; } }
  @keyframes twinkle{
    0%,100%{ opacity:.6; }
    50%{ opacity:1; }
  }
  @keyframes leafSway{
    0%,100%{ transform:rotate(-2.4deg); }
    50%{ transform:rotate(2deg); }
  }
  @keyframes sheenSweep{
    0%,62%{ transform:translateX(-140%); }
    82%{ transform:translateX(140%); }
    100%{ transform:translateX(140%); }
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes badgePulse{
    0%,100%{ box-shadow:0 8px 20px -8px rgba(0,0,0,.6); }
    50%{ box-shadow:0 8px 22px -6px rgba(201,160,106,.45); }
  }

  @media (prefers-reduced-motion: reduce){
    .card-glow, .light-track, .sheen, .badge, .leaf-overlay{ animation:none !important; }
    .tilt{ animation-duration:.01ms !important; animation-delay:0s !important; transition:none !important; }
    .poster{ transition:none !important; }
    .svc-title span{ transition:none !important; }
  }

  /* ==================================================================
     YENİ KATMAN — QR · 2K GALERİ · TIKLANABİLİR İLETİŞİM · YÖNETİM
     Yukarıdaki tasarım olduğu gibi korunmuştur; buradaki kurallar
     yalnızca eklenen bölümleri tanımlar.
     ================================================================== */

  /* --- Uzun kart her ekranda tamamen erişilebilir kalsın -------------------
     Eklenen bölümler kartı uzatır; dikey kaydırma açılır. Ortalamak için
     "margin:auto" kullanılır: boşluk varsa ortalar, taşma varsa üstte sabitler. */
  html{ height:auto; }
  body{
    min-height:100dvh; height:auto;
    overflow-y:auto; overflow-x:hidden;
    align-items:flex-start;
  }
  .scene{ margin:auto; touch-action:pan-y; }

  /* --- telefon uyumu --- */
  @media (max-width:640px){
    body{ padding:16px 12px calc(22px + env(safe-area-inset-bottom)); }
    .card-frame{ width:min(92vw, 520px); }
  }
  /* --- kısa ekranlar: kompakt mod --- */
  @media (max-width:640px) and (max-height:780px){
    :root{ --bar-h:70px; }
    .qr-dock{ padding:9px 10px 10px; }
    .qr-mini{ width:88px; height:88px; }
    .qr-dock-tx span{ display:none; }
    .gal-cell-t{ font-size:9.5px; }
    .wordmark{ font-size:8px; padding-bottom:10px; }
  }
  /* yatay telefon --- */
  @media (orientation:landscape) and (max-height:560px){
    .card-frame{ width:min(72vh, 520px); }
  }

  /* --- kaydırma ipucu (yalnız telefon) --- */
  .scroll-hint{
    position:fixed; left:50%; bottom:16px; z-index:70;
    transform:translateX(-50%); display:none; align-items:center; gap:8px;
    padding:10px 15px; border-radius:999px; cursor:pointer;
    -webkit-appearance:none; appearance:none; font-family:inherit;
    border:1px solid rgba(201,160,106,.45); background:rgba(8,12,9,.92);
    color:var(--gold-bright); font-size:9.5px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; line-height:1;
    box-shadow:0 16px 34px -16px rgba(0,0,0,.95);
    animation:hintPulse 2.8s ease-in-out infinite;
  }
  @media (max-width:640px){ .scroll-hint{ display:flex; } }
  .scroll-hint svg{ width:13px; height:13px; animation:hintBob 1.7s ease-in-out infinite; }
  .scroll-hint.hide{ display:none !important; }
  @keyframes hintPulse{ 0%,100%{ opacity:.8 } 50%{ opacity:1 } }
  @keyframes hintBob{ 0%,100%{ transform:translateY(-2px) } 50%{ transform:translateY(2px) } }

  /* --- poster üzerindeki hizmet başlıkları: dokunulabilir ipucu --- */
  .svc-title.tap{ cursor:pointer; }
  .svc-title.tap::after{
    content:"GÖRSEL";
    position:absolute; left:50%; top:calc(100% + 5px);
    transform:translateX(-50%) translateY(5px);
    padding:3px 8px; border-radius:999px; white-space:nowrap;
    font-size:7.5px; letter-spacing:.18em; font-weight:600;
    background:rgba(8,10,9,.88); border:1px solid rgba(201,160,106,.55);
    color:var(--gold-bright);
    opacity:0; pointer-events:none; transition:.26s cubic-bezier(.2,.8,.3,1);
  }
  .svc-title.tap:hover::after,
  .svc-title.tap:focus-visible::after{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* --- hizmet galerisi: poster basligi -> en fazla 100 gorsel --- */
  .gal-head{ text-align:center; padding:0 6px 2px; }
  .gal-head b{
    display:block; font-size:13px; letter-spacing:.2em; font-weight:600; color:var(--gold-bright);
  }
  .gal-head span{
    display:block; margin-top:5px; font-size:9.5px; letter-spacing:.12em; color:rgba(255,255,255,.45);
  }
  .gal-stage-wrap{
    flex:0 0 auto; min-width:0; width:100%;
  }
  .gal-grid-wrap{
    max-height:74dvh; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:2px;
  }
  .gal-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  @media (min-width:620px){ .gal-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (min-width:920px){ .gal-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .gal-cell{
    -webkit-appearance:none; appearance:none; display:block; width:100%; margin:0; padding:0;
    cursor:pointer; text-align:left; overflow:hidden; border-radius:14px;
    border:1px solid rgba(201,160,106,.24);
    background:linear-gradient(160deg, rgba(201,160,106,.1), rgba(255,255,255,.02));
    transition:border-color .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  .gal-cell:hover, .gal-cell:focus-visible{
    outline:none; border-color:rgba(201,160,106,.8);
    box-shadow:0 12px 26px -14px rgba(201,160,106,.95);
  }
  .gal-cell:active{ transform:scale(.985); }
  .gal-cell-img{
    position:relative; aspect-ratio:1/1; overflow:hidden;
    display:grid; place-items:center; background:#0b0f0c;
  }
  .gal-cell-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gal-cell-ph{ font-size:8px; letter-spacing:.14em; color:rgba(255,255,255,.28); }
  .gal-cell-b{ padding:8px 9px 10px; }
  .gal-cell-t{
    display:block; font-size:10.5px; font-weight:600; line-height:1.3; color:#f2e7d2;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .gal-cell-d{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    margin-top:4px; font-size:9.5px; line-height:1.45; color:rgba(255,255,255,.5);
  }
  .gal-cell-x{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .gal-empty{ padding:44px 22px; text-align:center; }
  .gal-empty b{ display:block; font-size:12px; letter-spacing:.16em; color:var(--gold-bright); }
  .gal-empty p{ margin:9px auto 0; max-width:440px; font-size:11px; line-height:1.65; color:rgba(255,255,255,.5); }
  .gal-cap-text{ margin-top:14px; text-align:center; padding:0 6px; }
  .gal-cap-text b{
    display:block; font-size:13px; letter-spacing:.14em; font-weight:600; color:#f4ead7;
  }
  .gal-cap-text p{
    margin:9px auto 0; max-width:640px; font-size:12px; line-height:1.75; color:rgba(255,255,255,.68);
    white-space:pre-wrap;
  }
  .gal-count{
    display:block; margin-top:9px; font-size:9.5px; letter-spacing:.16em; color:rgba(201,160,106,.9);
  }
  .modal-back{
    position:absolute; top:14px; left:14px; height:38px; padding:0 14px; z-index:3;
    display:flex; align-items:center; gap:7px; border-radius:999px; cursor:pointer;
    -webkit-appearance:none; appearance:none; font-family:inherit;
    font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    border:1px solid rgba(201,160,106,.4); background:rgba(12,16,13,.88); color:var(--gold-bright);
    transition:background .18s ease, color .18s ease;
  }
  .modal-back:hover{ background:var(--gold); color:var(--ink); }
  .modal-back svg{ width:13px; height:13px; }

  /* --- yonetici paneli: hizmet sekmeleri + gorsel listesi --- */
  .ed-tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:3px; margin-bottom:10px;
    touch-action:pan-x; -webkit-overflow-scrolling:touch;
  }
  .ed-tab{
    -webkit-appearance:none; appearance:none; flex:none; cursor:pointer; white-space:nowrap;
    padding:9px 12px; border-radius:999px; font-family:inherit;
    font-size:9px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; line-height:1;
    border:1px solid rgba(201,160,106,.3); background:rgba(201,160,106,.07); color:#efe2ca;
    transition:.18s ease;
  }
  .ed-tab.on{
    background:linear-gradient(155deg, var(--gold-bright), var(--gold));
    color:var(--ink); border-color:transparent;
  }
  .ed-tabs::-webkit-scrollbar{ height:3px; }
  .ed-tabs::-webkit-scrollbar-thumb{ background:rgba(201,160,106,.3); border-radius:9px; }
  .ed-meter{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .ed-meter b{ font-size:10px; letter-spacing:.14em; font-weight:600; color:#f0e4cd; white-space:nowrap; }
  .ed-meter .bar{ flex:1; min-width:80px; height:4px; border-radius:999px; background:rgba(201,160,106,.16); overflow:hidden; }
  .ed-meter .bar i{ display:block; height:100%; background:linear-gradient(90deg, var(--gold-bright), var(--gold)); }
  .ed-item{
    display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; padding:10px;
    border-radius:13px; border:1px solid rgba(201,160,106,.16); background:rgba(0,0,0,.22);
  }
  .ed-item .ed-thumb{ cursor:pointer; transition:border-color .18s ease; }
  .ed-item .ed-thumb:hover{ border-color:rgba(201,160,106,.7); }
  .ed-row-btns{ display:flex; gap:6px; flex-wrap:wrap; }

  /* --- QR şeridi --- */
  .qr-dock{
    display:flex; align-items:center; gap:11px; padding:11px 12px 12px;
    background:linear-gradient(180deg,#0a0f0b,#050705);
    border-top:1px solid rgba(201,160,106,.18);
    touch-action:manipulation;
  }
  .qr-mini{
    width:104px; height:104px; flex:none; padding:6px; border-radius:16px; cursor:pointer;
    -webkit-appearance:none; appearance:none; border:none; background:#fbf7ee;
    box-shadow:0 10px 22px -12px rgba(0,0,0,.95), 0 0 0 1px rgba(201,160,106,.45);
    transition:box-shadow .2s ease, transform .12s ease;
  }
  .qr-mini svg{ width:100%; height:100%; display:block; }
  .qr-mini:hover, .qr-mini:focus-visible{
    outline:none; transform:translateY(-1px);
    box-shadow:0 12px 26px -12px rgba(201,160,106,.9), 0 0 0 1px rgba(201,160,106,.85);
  }
  .qr-mini:active{ transform:scale(.97); }
  .qr-dock-tx{ flex:1; min-width:0; }
  .qr-dock-tx b{
    display:block; font-size:10px; letter-spacing:.14em; font-weight:600; color:#f0e4cd;
  }
  .qr-dock-tx span{
    display:block; margin-top:4px; font-size:9.5px; line-height:1.45; color:rgba(255,255,255,.5);
  }
  .qr-open{
    flex:none; padding:9px 13px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(201,160,106,.45); background:rgba(201,160,106,.1);
    color:var(--gold-bright); font-family:inherit; font-size:9.5px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; line-height:1;
    transition:background .18s ease, color .18s ease, transform .12s ease;
  }
  .qr-open:hover{ background:linear-gradient(155deg, var(--gold-bright), var(--gold)); color:var(--ink); }
  .qr-open:active{ transform:scale(.96); }
  .qr-ph{ padding:14px; font-size:10px; letter-spacing:.1em; color:rgba(255,255,255,.5); }

  /* --- yönetim düğmesi --- */
  .owner-gear{
    position:absolute; right:7px; bottom:5px; width:26px; height:26px; z-index:5;
    display:grid; place-items:center; border-radius:50%; cursor:pointer;
    -webkit-appearance:none; appearance:none; opacity:.5;
    border:1px solid rgba(201,160,106,.3); background:rgba(10,14,11,.75);
    color:rgba(201,160,106,.85);
    transition:opacity .2s ease, color .2s ease, border-color .2s ease;
  }
  .owner-gear svg{ width:13px; height:13px; }
  .owner-gear:hover, .owner-gear:focus-visible{
    opacity:1; outline:none; color:var(--gold-bright); border-color:rgba(201,160,106,.75);
  }

  /* --- ortak pencereler --- */
  .modal{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center; padding:18px;
    background:rgba(3,6,4,.9);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
  }
  .modal.open{ display:flex; animation:layerIn .26s ease both; }
  @keyframes layerIn{ from{opacity:0} to{opacity:1} }
  .modal-x{
    position:absolute; top:14px; right:14px; width:38px; height:38px; z-index:3;
    display:grid; place-items:center; border-radius:50%; cursor:pointer;
    -webkit-appearance:none; appearance:none; font-size:21px; line-height:1;
    border:1px solid rgba(201,160,106,.4); background:rgba(12,16,13,.85); color:var(--gold-bright);
    transition:background .18s ease, color .18s ease;
  }
  .modal-x:hover{ background:var(--gold); color:var(--ink); }

  /* --- galeri --- */
  .gal-card{
    position:relative; width:min(100%, 980px); max-height:92dvh;
    display:flex; flex-direction:column; gap:11px;
    animation:layerCard .4s cubic-bezier(.16,.84,.32,1) both;
  }
  @keyframes layerCard{ from{opacity:0; transform:translateY(20px) scale(.97)} to{opacity:1; transform:none} }
  .gal-stage{
    position:relative; overflow:hidden; border-radius:20px; display:grid; place-items:center;
    background:#0b0f0c; border:1px solid rgba(201,160,106,.32);
    box-shadow:0 40px 90px -34px rgba(0,0,0,.95);
    touch-action:pan-y;
  }
  .gal-stage img{
    display:block; width:100%; max-height:min(58dvh,620px); height:auto; object-fit:contain;
    background:#070a08;
  }
  .gal-ph{
    width:100%; min-height:min(42dvh,300px); padding:30px 22px;
    display:grid; place-items:center; text-align:center;
    background:radial-gradient(120% 92% at 50% 0%, rgba(201,160,106,.17), rgba(7,10,8,.92));
  }
  .gal-ph b{
    display:block; font-size:15px; letter-spacing:.16em; font-weight:600; color:var(--gold-bright);
  }
  .gal-ph p{ margin:9px auto 0; max-width:540px; font-size:12px; line-height:1.65; color:rgba(255,255,255,.62); }
  .gal-ph .gal-owner{ margin-top:14px; font-size:10.5px; letter-spacing:.06em; color:rgba(201,160,106,.85); }
  .gal-nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    cursor:pointer; -webkit-appearance:none; appearance:none; font-size:23px; line-height:1;
    border:1px solid rgba(201,160,106,.4); background:rgba(10,14,11,.82); color:var(--gold-bright);
    transition:background .18s ease, color .18s ease;
  }
  .gal-nav.prev{ left:10px; }
  .gal-nav.next{ right:10px; }
  .gal-nav:hover{ background:var(--gold); color:var(--ink); }
  .gal-cap{ text-align:center; padding:0 6px; }
  .gal-cap b{
    display:block; font-size:12.5px; letter-spacing:.2em; font-weight:600; color:#f2e7d2;
  }
  .gal-cap p{ margin:7px auto 0; max-width:580px; font-size:12px; line-height:1.6; color:rgba(255,255,255,.6); }
  .gal-dots{ display:flex; gap:7px; justify-content:center; }
  .gal-dots i{
    width:7px; height:7px; border-radius:50%; cursor:pointer; display:block;
    background:rgba(201,160,106,.28); transition:.2s ease;
  }
  .gal-dots i.on{ background:var(--gold-bright); box-shadow:0 0 9px rgba(255,224,158,.85); }
  .gal-tools{ display:flex; justify-content:center; }

  /* --- QR penceresi --- */
  .qr-card{
    position:relative; width:min(100%, 430px);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:26px 20px 20px; border-radius:26px;
    background:linear-gradient(180deg,#12180f,#070a08);
    border:1px solid rgba(201,160,106,.34);
    box-shadow:0 46px 100px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.05);
    animation:layerCard .4s cubic-bezier(.16,.84,.32,1) both;
  }
  .qr-plate{
    width:100%; padding:14px; border-radius:20px; background:#fbf7ee;
    box-shadow:0 20px 44px -18px rgba(0,0,0,.9), inset 0 0 0 1px rgba(201,160,106,.5);
  }
  .qr-plate svg{ display:block; width:100%; height:auto; }
  .qr-meta{
    text-align:center; font-size:9px; letter-spacing:.12em; line-height:1.6;
    color:rgba(255,255,255,.45); word-break:break-word;
    max-height:34px; overflow:hidden;
  }
  .qr-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
  .qa{
    padding:12px 8px; border-radius:13px; cursor:pointer; text-align:center;
    -webkit-appearance:none; appearance:none; font-family:inherit;
    border:1px solid rgba(201,160,106,.35); background:rgba(201,160,106,.08);
    color:#f0e4cd; font-size:9.5px; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; line-height:1.3;
    transition:background .18s ease, color .18s ease, transform .12s ease;
  }
  .qa:hover{ background:linear-gradient(155deg, var(--gold-bright), var(--gold)); color:var(--ink); border-color:transparent; }
  .qa:active{ transform:scale(.97); }

  /* --- yönetici paneli --- */
  .editor{
    position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
    background:radial-gradient(120% 80% at 50% 0%, #141b13, #050705 72%);
  }
  .editor.open{ display:flex; animation:layerIn .24s ease both; }
  .ed-head{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    border-bottom:1px solid rgba(201,160,106,.22); background:rgba(6,9,7,.92);
  }
  .ed-head h3{
    margin:0; font-size:12px; letter-spacing:.2em; font-weight:600;
    text-transform:uppercase; color:var(--gold-bright);
  }
  .ed-head p{ margin:3px 0 0; font-size:9.5px; letter-spacing:.05em; color:rgba(255,255,255,.4); }
  .ed-body{
    flex:1; overflow-y:auto; padding:14px 14px 26px;
    -webkit-overflow-scrolling:touch; touch-action:pan-y;
  }
  .ed-foot{
    display:flex; gap:8px; padding:11px 14px calc(11px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(201,160,106,.22); background:rgba(6,9,7,.95);
  }
  .ed-grp{
    margin:0 0 12px; padding:13px; border-radius:16px;
    border:1px solid rgba(201,160,106,.2); background:rgba(201,160,106,.05);
  }
  .ed-grp h4{
    margin:0 0 11px; font-size:9px; letter-spacing:.2em; font-weight:600;
    text-transform:uppercase; color:rgba(201,160,106,.95);
  }
  .ed-f{ margin-bottom:9px; }
  .ed-f label{
    display:block; margin-bottom:5px; font-size:8.5px; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.45);
  }
  .ed-f input, .ed-f select, .ed-f textarea{
    width:100%; padding:11px; border-radius:11px; outline:none;
    -webkit-appearance:none; appearance:none;
    border:1px solid rgba(201,160,106,.26); background:rgba(0,0,0,.35);
    color:#f4ebd8; font-family:inherit; font-size:12.5px; line-height:1.4;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .ed-f textarea{ min-height:58px; resize:vertical; }
  .ed-f input:focus, .ed-f select:focus, .ed-f textarea:focus{
    border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,160,106,.16);
  }
  .ed-slot{
    display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; padding:10px;
    border-radius:13px; border:1px solid rgba(201,160,106,.16); background:rgba(0,0,0,.22);
  }
  .ed-thumb{
    width:76px; height:76px; flex:none; display:grid; place-items:center;
    border-radius:12px; overflow:hidden; font-size:8px; letter-spacing:.1em;
    border:1px solid rgba(201,160,106,.22); background:rgba(201,160,106,.07);
    color:rgba(255,255,255,.35);
  }
  .ed-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ed-slot-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .ed-mini{
    padding:9px 11px; border-radius:10px; cursor:pointer; font-family:inherit;
    font-size:8.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; line-height:1;
    border:1px solid rgba(201,160,106,.32); background:rgba(201,160,106,.08); color:#f0e4cd;
    transition:background .18s ease, color .18s ease, transform .12s ease;
  }
  .ed-mini:hover{ background:var(--gold); color:var(--ink); border-color:transparent; }
  .ed-mini:active{ transform:scale(.96); }
  .ed-mini.primary{ background:linear-gradient(155deg, var(--gold-bright), var(--gold)); color:var(--ink); border-color:transparent; }
  .ed-mini.danger{ border-color:rgba(214,120,120,.42); background:rgba(214,120,120,.08); color:#eab3b3; }
  .ed-mini.danger:hover{ background:#d97878; color:#200d0d; }
  .ed-note{
    margin:0 0 11px; font-size:9.5px; line-height:1.6; color:rgba(255,255,255,.42);
  }

  @media (prefers-reduced-motion: reduce){
    .qr-mini, .qr-open, .qa, .ed-mini, .ed-tab{ transition:none !important; }
    .modal.open, .editor.open, .gal-card, .qr-card{ animation:none !important; }
    .svc-title.tap::after{ transition:none !important; }
  }
</style>
</head>

<script>
  const scene = document.getElementById('scene');
  const tilt = document.getElementById('tilt');
  const poster = document.getElementById('poster');
  const posterWrap = document.querySelector('.poster-wrap');
  const toastEl = document.getElementById('toast');

  // servis başlıklarının (MİMARİ TASARIM vb.) font boyutu, kartın o anki
  // gerçek piksel genişliğine göre ölçeklensin diye --pw değişkenini güncel tutuyoruz
  if ('ResizeObserver' in window){
    const ro = new ResizeObserver((entries) => {
      for (const entry of entries){
        const w = entry.contentRect.width;
        document.documentElement.style.setProperty('--pw', w + 'px');
      }
    });
    ro.observe(posterWrap);
  } else {
    document.documentElement.style.setProperty('--pw', posterWrap.getBoundingClientRect().width + 'px');
  }

  tilt.addEventListener('animationend', (e) => {
    if (e.animationName === 'cardIn') tilt.style.animation = 'none';
  });

    }
    function run(mode, fn) {
      return open().then(function (db) {

        });
      });
    }

      put: function (k, blob) { return run('readwrite', function (s) { return s.put(blob, k); }); },
      get: function (k) { return run('readonly', function (s) { return s.get(k); }); },
      del: function (k) { return run('readwrite', function (s) { return s.delete(k); }); }
    };
  })();

  var ASSET = {};   /* anahtar -> objectURL onbellegi */

  /* p = sitenin kendisinde yayınlanmis gorsel yolu (kalici), k = bu cihazdaki gorsel */
  function loadAsset(k, p, thumb) {
    if (p) return Promise.resolve(thumb || p);
    if (!k) return Promise.resolve(null);
    if (ASSET[k]) return Promise.resolve(ASSET[k]);
    return IDB.get(k).then(function (blob) {
      if (!blob) return null;
      ASSET[k] = URL.createObjectURL(blob);
      return ASSET[k];
    }).catch(function () { return null; });
  }
  function allKeys() {
    var out = [];
    CFG.services.forEach(function (s) { s.items.forEach(function (i) { out.push(i.k); }); });
    return out;
  }

  /* ---------- 2K görsel normalizasyonu ---------- */
  function normalizeImage(file, maxSide) {
    maxSide = maxSide || 2048;
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      function draw(src, w, hh) {
        var scale = Math.min(1, maxSide / Math.max(w, hh));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(hh * scale));
        var c = document.createElement('canvas'); c.width = cw; c.height = ch;
        var g = c.getContext('2d');
        g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
        g.drawImage(src, 0, 0, cw, ch);
        if (src.close) { try { src.close(); } catch (e) { } }
        function to(type, q) { return new Promise(function (r) { c.toBlob(function (b) { r(b); }, type, q); }); }
        to('image/webp', 0.92).then(function (b) { return b ? b : to('image/jpeg', 0.92); })
          .then(function (b) { b ? res({ blob: b, w: cw, h: ch }) : rej(new Error('Dönüştürülemedi')); });
      }
      fr.onload = function () {
        var im = new Image();
        im.onload = function () { draw(im, im.naturalWidth, im.naturalHeight); };
        im.onerror = function () { rej(new Error('Görsel açılamadı')); };
        im.src = fr.result;
      };
      fr.onerror = function () { rej(new Error('Dosya okunamadı')); };
      fr.readAsDataURL(file);
    });
  }

  function pickFiles(cb, multiple) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    if (multiple) inp.multiple = true;
    inp.style.display = 'none';
    inp.addEventListener('change', function () {
      var f = inp.files ? inp.files : null;
      if (f && f.length) cb(f);
      setTimeout(function () { inp.remove(); }, 100);
    });
    document.body.appendChild(inp);
    inp.click();
  }

  /* ==========================================================
     GALERİ — poster başlıkları burayı açar (100 görsel + metin)

          '<span class="gal-cell-b"><span class="gal-cell-t">' + h(it.t || ('Görsel ' + (i + 1))) + '</span>' +
          (it.d ? '<span class="gal-cell-d gal-cell-x">' + h(it.d) + '</span>' : '') +

  /* görselleri ekrana girdikçe yükle (100 adet için) */
  var IO = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      IO.unobserve(en.target);
      var k = en.target.dataset.k;
      loadAsset(k, en.target.dataset.p, en.target.dataset.th).then(function (url) {
        en.target.innerHTML = url
          ? '<img src="' + h(url) + '" alt="">'

    else {

        loadAsset(c.dataset.k, c.dataset.p, c.dataset.th).then(function (url) {

    b.innerHTML = html;

    /* alan bağlantıları */
    $$('#edBody input, #edBody textarea, #edBody select').forEach(function (el) {

            var wEl = $('#edBody input[data-k="whatsapp"]');
            if (wEl && CFG.whatsapp) wEl.value = CFG.whatsapp;
          }
        }
        else if (el.dataset.s != null) CFG.services[+el.dataset.s][el.dataset.sk] = el.value;
        else if (el.dataset.i != null) {
          var it = CFG.services[ED.tab].items[+el.dataset.i];
          if (it) it[el.dataset.sk] = el.value;

        saveSoon(); refreshQr(); syncAria();

    $$('#edBody [data-tab]').forEach(function (btn) {

  /* çoklu görsel ekleme */
  function addItems(svcIdx) {
    var s = CFG.services[svcIdx];
    var room = MAX_ITEM - s.items.length;
    if (room <= 0) { showToast('Bu hizmet için ' + MAX_ITEM + ' görsel sınırına ulaşıldı'); return; }
    pickFiles(function (files) {
      var list = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
      if (!list.length) return;
      var skipped = list.length - room;
      if (skipped > 0) list = list.slice(0, room);
      var i = 0;
      (function next() {
        if (i >= list.length) {
          save(); renderEditor(); syncAria(); refreshQr();
          showToast(list.length + ' görsel eklendi');
          return;
        }
        var f = list[i++];
        showToast('İşleniyor ' + i + '/' + list.length + '…');
        normalizeImage(f, 2048).then(function (out) {
          var it = { id: uid(), t: '', d: '', k: uid() };
          return IDB.put(it.k, out.blob).then(function () {
            CFG.services[svcIdx].items.push(it);
            var n = CFG.services[svcIdx].items.length;
            var mb = $('#edBody .ed-meter b');
            if (mb) mb.textContent = n + ' / ' + MAX_ITEM;
            var bar = $('#edBody .ed-meter .bar i');
            if (bar) bar.style.width = Math.min(100, Math.round(n / MAX_ITEM * 100)) + '%';
          });
        }).then(next).catch(function (e) {
          showToast('Hata: ' + (e.message || 'bilinmiyor'));
          next();
        });
      })();
      if (skipped > 0) setTimeout(function () { showToast(skipped + ' görsel sınır nedeniyle atlandı'); }, 1500);
    }, true);
  }

  /* ---------- QR ---------- */
  function vcard() {
    var c = CFG;
    var e = function (s) {
      return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n')
        .replace(/,/g, '\\,').replace(/;/g, '\\;');
    };
    var n = String(c.name || '').trim().split(/\s+/).filter(Boolean);
    var last = n.length > 1 ? n[n.length - 1] : '';
    var first = n.length > 1 ? n.slice(0, -1).join(' ') : (n[0] || '');
    var L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + e(last) + ';' + e(first) + ';;;', 'FN:' + e(c.name)];
    if (c.company) L.push('ORG:' + e(c.company));
    if (c.title) L.push('TITLE:' + e(c.title));
    if (c.tel) L.push('TEL;TYPE=CELL,VOICE:' + e(c.tel));
    if (c.email) L.push('EMAIL;TYPE=INTERNET:' + e(c.email));
    if (c.web) L.push('URL:' + e(c.web));
    if (c.igUrl) L.push('X-SOCIALPROFILE;type=instagram:' + e(c.igUrl));
    L.push('NOTE:' + e(c.company));
    L.push('END:VCARD');
    return L.join('\r\n');
  }

  function mecard(withSocial, compact) {
    var c = CFG;
    var e = function (s) {
      return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,');
    };
    var n = String(c.name || '').trim().split(/\s+/).filter(Boolean);
    var last = n.length > 1 ? n[n.length - 1] : '';
    var first = n.length > 1 ? n.slice(0, -1).join(' ') : (n[0] || '');
    var s = 'MECARD:N:' + e(last + (first ? ',' + first : '')) + ';';
    if (c.company) s += 'ORG:' + e(compact ? String(c.company).split(/\s+/)[0] : c.company) + ';';
    if (c.title && !compact) s += 'NOTE:' + e(c.title) + ';';
    if (c.tel) s += 'TEL:' + e(c.tel) + ';';
    if (c.email) s += 'EMAIL:' + e(c.email) + ';';
    if (withSocial && c.igUrl) s += 'X-SOCIALPROFILE;type=instagram:' + e(c.igUrl) + ';';
    return s + ';';
  }

  var QR_STATE = null;
  function buildQr() {
    var list;
    if (CFG.qrMode === 'url') {
      list = [(CFG.web || '').trim() || location.href];
    } else {
      /* ONCE kisa MECARD: okunabilirlik icin modul sayisi dusuk kalsin.
         NOTEsiz ve sosyal medyasiz (N + ORG + TEL + EMAIL). */
      list = [mecard(false, true), mecard(false), 'MECARD:N:' + (CFG.name || '') + ';TEL:' + (CFG.tel || '') + ';;'];
      list.push((CFG.web || '').trim() || location.href);
    }
    for (var i = 0; i < list.length; i++) {
      var q = QRLIB.encode(list[i]);
      if (q) return { qr: q, text: list[i] };
    }
    return null;
  }

  function qrSvg(qr, opt) {
    opt = opt || {};
    var size = qr.size, q = 4, total = size + q * 2, u = opt.uid || 'a', y, x, d = '';
    var step = 100 / total;
    for (y = 0; y < size; y++) {
      x = 0;
      while (x < size) {
        if (qr.modules[y][x]) {
          var run = 1;
          while (x + run < size && qr.modules[y][x + run]) run++;
          var rx = (x + q) * step, ry = (y + q) * step, rw = run * step;
          d += 'M' + rx.toFixed(3) + ' ' + ry.toFixed(3) + 'h' + rw.toFixed(3) + 'v' + step.toFixed(3) +
               'h-' + rw.toFixed(3) + 'z';
          x += run;
        } else x++;
      }
    }
    var dim = opt.px ? ' width="' + opt.px + '" height="' + opt.px + '"' : '';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"' + dim +
      ' shape-rendering="crispEdges" role="img" aria-label="QR kod">' +
      '<defs><linearGradient id="g' + u + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + (opt.c1 || '#6d4f26') + '"/>' +
      '<stop offset="1" stop-color="' + (opt.c2 || '#b08544') + '"/></linearGradient></defs>' +
      '<rect width="100" height="100" fill="' + (opt.bg || '#fbf7ee') + '"/>' +
      '<path d="' + d + '" fill="url(#g' + u + ')"/></svg>';
  }

  function renderDock() {
    var box = $('#qrDock');
    if (!box) return;
    if (!QR_STATE) { box.innerHTML = '<div class="qr-ph">QR hazırlanamıyor</div>'; return; }
    box.innerHTML =
      '<button class="qr-mini" type="button" id="qrMini" aria-label="QR kodunu büyüt">' + qrSvg(QR_STATE.qr, { uid: 'mini' }) + '</button>' +
      '<div class="qr-dock-tx"><b>KARTVİZİT QR</b><span>QR’a dokunun, büyüsün — telefonla okutun, tek dokunuşla rehbere kaydedin.</span></div>' +
      '<button class="qr-open" type="button" id="qrOpen">Aç</button>';
    $('#qrMini').addEventListener('click', openQr);
    $('#qrOpen').addEventListener('click', openQr);
  }
  function refreshQr() { QR_STATE = buildQr(); renderDock(); }

  function openQr() {
    var st = QR_STATE || buildQr();
    if (!st) { showToast('QR hazırlanamadı'); return; }
    QR_STATE = st;
    $('#qrBig').innerHTML = qrSvg(st.qr, { uid: 'big' });
    $('#qrMeta').textContent = CFG.qrMode === 'url'
      ? 'Bağlantı: ' + st.text
      : 'Kartvizit (MECARD) · sürüm ' + st.qr.version + '-' + st.qr.level;
    openModal('#qrModal');
  }

  function qrPng(cb) {
    if (!QR_STATE) return cb(null);
    var px = 1400;
    var img = new Image();
    img.onload = function () {
      var c = document.createElement('canvas'); c.width = px; c.height = px;
      var g = c.getContext('2d');
      g.fillStyle = '#fbf7ee'; g.fillRect(0, 0, px, px);
      g.drawImage(img, 0, 0, px, px);
      try { c.toBlob(function (b) { cb(b); }, 'image/png'); } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qrSvg(QR_STATE.qr, { px: px, uid: 'png' }));
  }

  function download(blob, name) {
    if (!blob) { showToast('İndirilemedi'); return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

  function shareCard() {
    var data = {
      title: CFG.company || 'Dijital Kartvizit',
      text: (CFG.company || '') + ' — ' + (CFG.phoneText || ''),
      url: (CFG.web || '').trim() || location.href
    };
    if (navigator.share) { navigator.share(data).catch(function () { }); }
    else if (navigator.clipboard) {
      navigator.clipboard.writeText(data.url)
        .then(function () { showToast('Bağlantı kopyalandı'); }, function () { showToast('Kopyalanamadı'); });
    } else showToast('Paylaşım desteklenmiyor');
  }

  /* ==========================================================
     ARAYÜZ İSKELETİ
     ========================================================== */
  function buildUI() {
    var html =
      '<div class="modal" id="galModal" role="dialog" aria-modal="true" aria-label="Hizmet galerisi">' +
      '<button class="modal-x" type="button" data-close="1" aria-label="Kapat">×</button>' +
      '<button class="modal-back" type="button" id="galBack">' + ICO.back + '<span>Geri</span></button>' +
      '<div class="gal-card">' +
      '<div class="gal-head"><b id="galTitle"></b><span id="galCount"></span></div>' +
      '<div class="gal-grid-wrap" id="galGridWrap"></div>' +
      '<div class="gal-stage-wrap" style="display:none">' +
      '<div class="gal-stage" id="galStage"></div>' +
      '<button class="gal-nav prev" type="button" id="galPrev" aria-label="Önceki">‹</button>' +
      '<button class="gal-nav next" type="button" id="galNext" aria-label="Sonraki">›</button>' +
      '<div class="gal-cap-text"><b id="galItemT"></b><p id="galItemD"></p><span class="gal-count" id="galItemN"></span></div>' +
      '</div></div></div>' +

      '<div class="modal" id="qrModal" role="dialog" aria-modal="true" aria-label="QR kod">' +
      '<button class="modal-x" type="button" data-close="1" aria-label="Kapat">×</button>' +
      '<div class="qr-card">' +
      '<div class="qr-plate" id="qrBig"></div>' +
      '<div class="qr-meta" id="qrMeta"></div>' +
      '<div class="qr-actions">' +
      '<button class="qa" type="button" data-qa="vcf">Kartvizit (.vcf)</button>' +
      '<button class="qa" type="button" data-qa="png">QR PNG</button>' +
      '<button class="qa" type="button" data-qa="copy">Bağlantıyı kopyala</button>' +
      '<button class="qa" type="button" data-qa="share">Paylaş</button>' +
      '</div></div></div>' +

      '<div class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Kart yönetimi">' +
      '<div class="ed-head"><div><h3>Kart Yönetimi</h3><p>Bilgiler ve görseller bu cihazda saklanır</p></div>' +
      '<button class="ed-mini" type="button" id="edClose" style="margin-left:auto">Kapat</button></div>' +
      '<div class="ed-body" id="edBody"></div>' +
      '<div class="ed-foot"><button class="ed-mini primary" type="button" id="edSave" style="flex:2">Kaydet</button>' +
      '<button class="ed-mini" type="button" id="edExport">Yedek al</button>' +
      '<button class="ed-mini" type="button" id="edImport">Yedek yükle</button>' +
      '<button class="ed-mini danger" type="button" id="edReset">Sıfırla</button></div>' +
      '</div>';
    document.body.insertAdjacentHTML('beforeend', html);

    var inner = $('.card-inner');
    if (inner) {
      var gear = document.createElement('button');
      gear.className = 'owner-gear';
      gear.id = 'ownerGear';
      gear.type = 'button';
      gear.title = 'Kart yönetimi';
      gear.setAttribute('aria-label', 'Kart yönetimi');
      gear.innerHTML = ICO.gear;
      inner.appendChild(gear);
      gear.addEventListener('click', openEditor);
    }
  }

  /* ---------- kaydırma ipucu ---------- */
  function buildHint() {
    var btn = document.createElement('button');
    btn.className = 'scroll-hint';
    btn.type = 'button';
    btn.id = 'scrollHint';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg><span>Aşağı kaydır</span>';
    document.body.appendChild(btn);
    var hide = function () { btn.classList.add('hide'); };
    var update = function () { if (document.documentElement.scrollHeight <= window.innerHeight + 60) hide(); };
    btn.addEventListener('click', function () {
      window.scrollBy({ top: Math.round(window.innerHeight * 0.55), behavior: 'smooth' });
      setTimeout(hide, 700);
    });
    window.addEventListener('scroll', hide, { passive: true });
    window.addEventListener('resize', debounce(update, 250));
    setTimeout(update, 350);
    setTimeout(hide, 9000);
  }

  /* ---------- modal yönetimi ---------- */
  function openModal(sel) { $(sel).classList.add('open'); lockScroll(true); }
  function closeModal(m) {
    m.classList.remove('open');
    if (!$('.modal.open') && !$('#editor').classList.contains('open')) lockScroll(false);
  }
  function lockScroll(on) {
    document.body.style.overflowY = on ? 'hidden' : '';
    document.documentElement.style.overflowY = on ? 'hidden' : '';
  }

  /* ---------- yedekleme ---------- */
  function exportAll() {
    var keys = allKeys();
    var out = { v: 2, cfg: CFG, images: {} };
    if (keys.length > 25 &&
      !confirm(keys.length + ' görsel yedeklenecek. Bu dosya büyük olabilir. Devam?')) {
      return;
    }
    var jobs = keys.map(function (k) {
      return loadAsset(k).then(function (url) {
        if (!url) return;
        return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
          return new Promise(function (res) {
            var fr = new FileReader();
            fr.onload = function () { out.images[k] = fr.result; res(); };
            fr.onerror = function () { res(); };
            fr.readAsDataURL(b);
          });
        });
      }).catch(function () { });
    });
    Promise.all(jobs).then(function () {
      download(new Blob([JSON.stringify(out)], { type: 'application/json' }), 'maybel-kart-yedek.json');
      showToast('Yedek indirildi');
    });
  }
  function importAll(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var data;
      try { data = JSON.parse(fr.result); } catch (e) { showToast('Dosya okunamadı'); return; }
      if (!data || !data.cfg) { showToast('Geçersiz yedek'); return; }
      CFG = Object.assign(JSON.parse(JSON.stringify(DEF)), data.cfg);
      if (!Array.isArray(CFG.services) || !CFG.services.length) CFG.services = defServices();
      CFG.services = CFG.services.slice(0, 5).map(function (s, i) {
        var d = defServices()[i];
        var items = Array.isArray(s.items) ? s.items.slice(0, MAX_ITEM).map(function (it) {
          return { id: it.id || uid(), t: it.t || '', d: it.d || '', k: it.p ? '' : (it.k || uid()), p: it.p || '' };
        }) : [];
        return { t: s.t || d.t, d: s.d || d.d, items: items };
      });
      save();
      var jobs = Object.keys(data.images || {}).map(function (k) {
        return new Promise(function (res) {
          fetch(data.images[k]).then(function (r) { return r.blob(); }).then(function (b) {
            return IDB.put(k, b).then(function () {
              if (ASSET[k]) URL.revokeObjectURL(ASSET[k]);
              ASSET[k] = URL.createObjectURL(b); res();
            });
          }).catch(function () { res(); });
        });
      });
      Promise.all(jobs).then(function () { renderAll(); renderEditor(); showToast('Yedek yüklendi'); });
    };
    fr.readAsText(file);
  }

  /* ---------- eylemler (yeşil ikon şeridi) ---------- */
  function doAction(act) {
    var t, w, u;
    if (act === 'tel') {
      t = telNorm(CFG.tel || CFG.phoneText);
      if (t) location.href = 'tel:' + t; else showToast('Numara eklenmedi');
    } else if (act === 'wa') {
      w = waDigits(CFG.whatsapp || CFG.tel);
      if (w) {
        u = 'https://wa.me/' + w;
        if (CFG.waText) u += '?text=' + encodeURIComponent(CFG.waText);
        window.open(u, '_blank', 'noopener');
      } else showToast('Numara eklenmedi');
    } else if (act === 'mail') {
      if (CFG.email) location.href = 'mailto:' + CFG.email; else showToast('E-posta eklenmedi');
    } else if (act === 'map') {
      var q = (CFG.mapQuery || '').trim() || 'Espiye, Giresun';
      window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q), '_blank', 'noopener');
    } else if (act === 'share') {
      shareCard();
    }
  }

  /* ---------- olaylar ---------- */
  function wire() {
    /* poster üzerindeki 5 hizmet başlığı -> galeri */
    $$('.svc-title').forEach(function (el, i) {
      if (!CFG.services[i]) return;
      el.classList.add('tap');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', CFG.services[i].t + ' — görseller');
      el.addEventListener('click', function () { openGallery(i); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGallery(i); }
      });
    });

    /* ikon şeridi -> yapılandırmadan çalışsın */
    var ACT = { 'btn-phone': 'tel', 'btn-wa': 'wa', 'btn-mail': 'mail', 'btn-map': 'map', 'btn-share': 'share' };
    $('#scene').addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.icon-btn') : null;
      if (!btn) return;
      var act = ACT[btn.id];
      if (!act) return;
      e.preventDefault(); e.stopPropagation();
      doAction(act);
    }, true);

    /* pencereler */
    $$('.modal').forEach(function (m) {
      m.addEventListener('click', function (e) {
        if (e.target === m || e.target.closest('[data-close]')) closeModal(m);
      });
    });
    $('#galBack').addEventListener('click', function () { showMode('grid'); });
    $('#galPrev').addEventListener('click', function () { step(-1); });
    $('#galNext').addEventListener('click', function () { step(1); });
    $('#galGridWrap').addEventListener('click', function (e) {
      var c = e.target.closest('.gal-cell');
      if (c) openStage(+c.dataset.i);
    });

    /* galeri kaydırma */
    var sx = 0, sy = 0;
    var st = $('#galStage');
    st.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; });
    st.addEventListener('pointerup', function (e) {
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    });

    /* QR eylemleri */
    $('#qrModal').addEventListener('click', function (e) {
      var b = e.target.closest('[data-qa]');
      if (!b) return;
      var a = b.dataset.qa;
      if (a === 'vcf') download(new Blob([vcard()], { type: 'text/vcard;charset=utf-8' }),
        (CFG.name || 'kartvizit').replace(/\s+/g, '-') + '.vcf');
      else if (a === 'png') qrPng(function (blob) { download(blob, 'maybel-qr.png'); });
      else if (a === 'copy') {
        var u = (CFG.web || '').trim() || location.href;
        if (navigator.clipboard) navigator.clipboard.writeText(u)
          .then(function () { showToast('Bağlantı kopyalandı'); }, function () { showToast('Kopyalanamadı'); });
        else showToast('Kopyalanamadı');
      } else if (a === 'share') shareCard();
    });

    /* yönetici paneli */
    $('#edClose').addEventListener('click', function () {
      $('#editor').classList.remove('open');
      lockScroll(false);
    });
    $('#edSave').addEventListener('click', function () { save(); renderAll(); showToast('Kaydedildi'); });
    $('#edExport').addEventListener('click', exportAll);
    $('#edImport').addEventListener('click', function () { pickFiles(function (f) { importAll(f[0]); }, false); });
    $('#edReset').addEventListener('click', function () {
      if (!confirm('Tüm bilgiler ve görseller silinsin mi?')) return;
      allKeys().forEach(function (k) {
        if (ASSET[k]) { URL.revokeObjectURL(ASSET[k]); delete ASSET[k]; }
        IDB.del(k).catch(function () { });
      });
      CFG = JSON.parse(JSON.stringify(DEF));
      CFG.services = defServices();
      ED.tab = 0;
      try { localStorage.removeItem(CFG_KEY); } catch (e) { }
      renderAll(); renderEditor(); showToast('Sıfırlandı');
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        var m = $('.modal.open');
        if (m) {
          if (m.id === 'galModal' && G.mode === 'stage') { showMode('grid'); return; }
          closeModal(m); return;
        }
        if ($('#editor').classList.contains('open')) { $('#editor').classList.remove('open'); lockScroll(false); }
      }
      if ($('#galModal').classList.contains('open') && G.mode === 'stage') {
        if (e.key === 'ArrowRight') step(1);
        if (e.key === 'ArrowLeft') step(-1);
      }
    });
  }

  /* ---------- hepsi ---------- */
  function syncAria() {
    $$('.svc-title').forEach(function (el, i) {
      if (CFG.services[i]) el.setAttribute('aria-label', CFG.services[i].t + ' — görseller');
    });
  }
  function renderAll() { refreshQr(); syncAria(); }

  function boot() {
    buildUI();
    buildHint();
    renderAll();
    wire();
    setTimeout(function () {
      try {
        if (!localStorage.getItem('maybel.seen')) {
          localStorage.setItem('maybel.seen', '1');
          showToast('Posterdeki hizmet başlıklarına dokunun');
        }
      } catch (e) { }
    }, 1500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();</script>
</body>
